<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fluent Clock</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/icon?family=Material+Icons"
  />
</head>
<body>
<nav>
  <ul>
    <li><a href="#clock"><span class="material-icons">schedule</span> Clock</a></li>
    <li><a href="#alarm"><span class="material-icons">alarm</span> Alarm</a></li>
    <li><a href="#stopwatch"><span class="material-icons">timer</span> Stopwatch</a></li>
    <li><a href="#timer"><span class="material-icons">hourglass_empty</span> Timer</a></li>
  </ul>
</nav>
<main>
  <section id="clock">
    <x-clock>
      <time>00:00:00</time>
    </x-clock>
  </section>

  <section id="alarm">
    <x-alarm>
      <template>
        <section class="alarms">
          <input type="time" min="00:00" max="23:59" step="1" />
          <section class="controls">
            <button class="start material-icons" title="Enable Alarm">alarm_on</button>
            <button class="pause material-icons" title="Disable Alarm">alarm_off</button>
            <button class="delete material-icons" title="Delete Alarm">delete</button>
          </section>
        </section>
      </template>
      <section class="items"></section>
      <section class="controls">
        <button class="add material-icons" title="Add Alarm">add_alarm</button>
      </section>
    </x-alarm>
  </section>

  <section id="stopwatch">
    <x-stopwatch>
      <time datetime="PT0S">00:00:00.00</time>
      <section class="controls">
        <button class="start material-icons" title="Start Stopwatch">play_arrow</button>
        <button class="pause material-icons" title="Pause Stopwatch">pause</button>
        <button class="restart material-icons" title="Reset Stopwatch">restart_alt</button>
      </section>
    </x-stopwatch>
  </section>

  <section id="timer">
    <x-timer>
      <time datetime="PT0S">00:00:00.00</time>
      <section class="items">
        <section class="timers">
          <input
                  type="time"
                  min="00:00:00"
                  max="23:59:59"
                  value="00:03:00"
                  step="1"
          />
          <input
                  type="time"
                  min="00:00:00"
                  max="23:59:59"
                  value="00:01:00"
                  step="1"
          />
        </section>
      </section>
      <section class="controls">
        <button class="start material-icons" title="Start Timer">play_arrow</button>
        <button class="pause material-icons" title="Pause Timer">pause</button>
        <button class="restart material-icons" title="Reset Timer">restart_alt</button>
        <button class="loop material-icons" title="Enable Loop">repeat</button>
        <button class="no-loop material-icons" title="Disable Loop">repeat_one</button>
      </section>
    </x-timer>
  </section>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
